name: Test Translation Endpoint
on:
  push:
    branches:
      - preview/sync-vietnam-site-ko-20260908
    paths:
      - '.github/workflows/test-translate-endpoint.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test Google translation endpoint
        run: |
          set -e
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          q = urllib.parse.urlencode({'client':'gtx','sl':'vi','tl':'ko','dt':'t','q':'Học phí và học bổng XJTLU'})
          url = 'https://translate.googleapis.com/translate_a/single?' + q
          t=time.time()
          with urllib.request.urlopen(url, timeout=5) as r:
              data=json.load(r)
          print('elapsed', round(time.time()-t,3))
          print('translation', ''.join(x[0] for x in data[0] if x and x[0]))
          PY
