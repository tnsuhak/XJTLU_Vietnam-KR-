name: Sync Vietnam KR Reference Preview

on:
  push:
    branches:
      - preview/sync-vietnam-20260905
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: preview/sync-vietnam-20260905
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync Korean reference mirror
        run: python scripts/sync_vietnam_kr_reference_20260905.py
      - name: Commit generated preview
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html robots.txt xjtlu-*.html du-hoc-*.html news/index.html
          git commit -m "Sync Korean review mirror with Vietnam preview"
          git push origin HEAD:preview/sync-vietnam-20260905
