name: Match Vietnam Menu Style

on:
  push:
    branches:
      - preview/sync-vietnam-20260905
  workflow_dispatch:

permissions:
  contents: write

jobs:
  match-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/sync-vietnam-20260905
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Vietnam menu appearance to Korean mirror subpages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          STYLE = r'''<style id="tns-vietnam-menu-match-20260906">
          /* Match XJTLU Vietnam menu panel appearance across Korean review subpages. */
          .tns-global-menu-btn{display:inline-flex!important;align-items:center;justify-content:center;gap:8px;background:#fff!important;border:1px solid #d9dde6!important;color:#14213d!important;padding:9px 13px!important;border-radius:4px!important;font-family:inherit!important;font-size:13.5px!important;font-weight:800!important;cursor:pointer!important;white-space:nowrap!important;line-height:1!important;height:42px!important;width:auto!important}
          .tns-global-menu-btn:hover,.tns-global-menu-btn[aria-expanded="true"]{background:#14213d!important;color:#fff!important;border-color:#14213d!important}
          .tns-global-menu-icon{font-size:15px!important;font-weight:400!important;line-height:1!important}
          .tns-site-menu{display:none!important;position:fixed!important;left:0!important;right:0!important;z-index:190!important;background:#fff!important;color:#262d40!important;border-top:1px solid rgba(20,33,61,.1)!important;box-shadow:0 24px 55px rgba(10,18,34,.22)!important;overflow-y:auto!important}
          .tns-site-menu.tns-main-menu{top:calc(var(--topbar,36px) + var(--nav,70px))!important;max-height:calc(100vh - var(--topbar,36px) - var(--nav,70px))!important}
          .tns-site-menu.tns-sub-menu{top:62px!important;max-height:calc(100vh - 62px)!important}
          .tns-site-menu.open{display:block!important}
          .tns-site-menu-inner{max-width:1200px!important;margin:0 auto!important;padding:28px 40px 34px!important}
          .tns-site-menu-head{display:flex!important;align-items:flex-start!important;justify-content:space-between!important;gap:20px!important;padding-bottom:18px!important;border-bottom:1px solid #e4e7ec!important;background:#fff!important;color:#14213d!important;min-height:0!important}
          .tns-site-menu-headcopy>span{display:block!important;color:#9a7827!important;font-size:10px!important;font-weight:800!important;letter-spacing:.13em!important;margin-bottom:4px!important}
          .tns-site-menu-head h2{font-family:inherit!important;font-size:25px!important;line-height:1.3!important;margin:0!important;color:#14213d!important}
          .tns-site-menu-head p{margin:6px 0 0!important;color:#6a7283!important;font-size:13px!important;line-height:1.6!important}
          .tns-site-menu-close{border:1px solid #d9dde6!important;background:#fff!important;color:#14213d!important;width:38px!important;height:38px!important;border-radius:0!important;cursor:pointer!important;font-size:17px!important;line-height:1!important;flex:none!important;padding:0!important}
          .tns-site-menu-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:24px 30px!important;padding-top:24px!important}
          .tns-site-menu-group{min-width:0!important;padding:0!important;border:0!important;background:transparent!important}
          .tns-site-menu-group h3{font-family:inherit!important;font-size:16px!important;color:#14213d!important;margin:0 0 7px!important;border-bottom:2px solid #14213d!important}
          .tns-site-menu-group h3 a{display:flex!important;align-items:baseline!important;justify-content:space-between!important;gap:10px!important;text-decoration:none!important;color:#14213d!important;padding:0 2px 10px!important;font-weight:800!important;background:transparent!important;border:0!important}
          .tns-site-menu-group h3 a:hover{color:#9a7827!important}
          .tns-site-menu-group h3 small{font-size:10.5px!important;font-weight:700!important;color:#9a7827!important;white-space:nowrap!important}
          .tns-site-menu-group>a{display:block!important;text-decoration:none!important;color:#4f596e!important;font-size:14px!important;font-weight:600!important;line-height:1.45!important;padding:8px 2px!important;border-bottom:1px solid #eeeae1!important;background:transparent!important;border-radius:0!important}
          .tns-site-menu-group>a:hover{color:#9a7827!important;background:transparent!important}
          .tns-site-menu-group>p{font-size:13px!important;line-height:1.65!important;color:#747c8c!important;margin:10px 2px 0!important}
          @media(max-width:960px){
            .tns-site-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            .tns-site-menu-inner{padding:22px 20px 30px!important}
          }
          @media(max-width:620px){
            .tns-site-menu-grid{grid-template-columns:1fr!important;gap:22px!important}
            .tns-site-menu-head h2{font-size:22px!important}
            .tns-site-menu-head p{font-size:12px!important}
            .tns-site-menu-inner{padding:20px 18px 28px!important}
            .tns-global-menu-btn{height:40px!important;padding:8px 11px!important;font-size:13px!important}
            .tns-site-menu.tns-sub-menu{top:58px!important;max-height:calc(100vh - 58px)!important}
          }
          </style>'''

          paths = sorted(set(Path('.').glob('*.html')) | set(Path('news').glob('*.html')))
          changed = []
          for p in paths:
              if p.name == 'index.html' and p.parent == Path('.'):
                  # Homepage already uses the Vietnam-style menu CSS.
                  continue
              text = p.read_text(encoding='utf-8')
              if 'tns-site-menu' not in text or '</head>' not in text:
                  continue
              text = re.sub(r'\n?<style id="tns-vietnam-menu-match-20260906">.*?</style>', '', text, flags=re.S)
              text = text.replace('</head>', STYLE + '\n</head>', 1)
              p.write_text(text, encoding='utf-8')
              changed.append(str(p))

          if not changed:
              raise SystemExit('No Korean mirror subpages with TNS menu found')
          print('Updated menu appearance on:')
          print('\n'.join(changed))
          PY
      - name: Validate menu style
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=[]
          for p in list(Path('.').glob('*.html')) + list(Path('news').glob('*.html')):
              if p.name == 'index.html' and p.parent == Path('.'):
                  continue
              t=p.read_text(encoding='utf-8')
              if 'tns-site-menu' in t:
                  pages.append(p)
                  assert 'tns-vietnam-menu-match-20260906' in t, p
                  assert 'grid-template-columns:repeat(3,minmax(0,1fr))' in t, p
                  assert '.tns-site-menu.tns-sub-menu{top:62px' in t, p
          print(f'Validated {len(pages)} menu-enabled subpages')
          PY
      - name: Commit generated preview changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'news/*.html'
          git commit -m "style(preview): match Korean menu to Vietnam site"
          git pull --rebase origin preview/sync-vietnam-20260905
          git push origin HEAD:preview/sync-vietnam-20260905
