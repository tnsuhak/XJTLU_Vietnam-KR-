name: Test Qwen Korean Polish
on:
  push:
    branches: [preview/sync-vietnam-site-ko-20260908]
    paths: ['.github/workflows/test-qwen-korean-polish.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          pip install --disable-pip-version-check 'transformers<5' sentencepiece
      - name: Test polish
        run: |
          python - <<'PY'
          import torch
          from transformers import AutoTokenizer, AutoModelForCausalLM
          name='Qwen/Qwen2.5-0.5B-Instruct'
          tok=AutoTokenizer.from_pretrained(name)
          model=AutoModelForCausalLM.from_pretrained(name)
          model.eval()
          samples=[
            ('XJTLU 2027 학비는 연간 99,000 RMB입니다. 입학 장학금은 최대 50%, Early Bird는 10%입니다.', '2027년 XJTLU 학점은 연간 99,000원이다. 입학학비은 50%까지, Early Bird 10%까지.'),
            ('XJTLU 2027 미니 브로셔에 따르면 국제 학부생의 연간 학비는 99,000 RMB입니다. 학비 외에 숙박, 식비, 보험, 서비스 비용, 비자/거류허가 및 개인 지출이 추가됩니다.', '연간 99,000만원 국제 학부생에 대한 XJTLU 2027 미니 브로서. 학부금 이외에도 숙박, 음식, 보험, 서비스료, 비자/주택권 및 개인 지출이 추가됩니다.'),
            ('중국 쑤저우에 위치한 XJTLU는 영국·중국 합작 국제대학입니다.', 'XJTLU: 초에 있는 영국 국제 대학'),
            ('Early Bird 혜택은 조건을 충족하는 국제 학부생에게 연간 학비의 10%를 감면합니다.', '자격을 갖춘 국제 학부 학생의 연간 학비를 10% 줄여야 합니다.'),
            ('XJTLU 메인 캠퍼스는 쑤저우 SIP에 있으며 상하이와 빠르게 연결됩니다.', '주소는 도쿄 (SIP) 에 있으며, 상하이와 빠른 연결이 있습니다.'),
          ]
          for correct,draft in samples:
              prompt=("당신은 한국 유학원 웹사이트의 전문 한국어 편집자입니다. 아래 초안을 자연스럽고 정확한 한국어로 고치세요. "
                      "숫자, 통화(RMB), 학교명, 지명, 2+2 같은 사실은 절대 바꾸지 마세요. 설명 없이 수정문장만 출력하세요.\n\n초안: "+draft)
              msgs=[{'role':'system','content':'자연스러운 한국어 웹문구를 작성하는 전문 편집자입니다.'},{'role':'user','content':prompt}]
              text=tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True)
              inp=tok(text,return_tensors='pt')
              with torch.inference_mode():
                  out=model.generate(**inp,max_new_tokens=140,do_sample=False)
              gen=tok.decode(out[0][inp.input_ids.shape[1]:],skip_special_tokens=True).strip()
              print('DRAFT:',draft)
              print('QWEN :',gen)
              print('IDEAL:',correct)
              print('---')
          PY
