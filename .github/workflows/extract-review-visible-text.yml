name: Extract Korean Review Visible Text
# Final human QA refresh after pass 3.
on:
  push:
    branches: [preview/sync-vietnam-site-ko-20260908]
    paths:
      - '*.html'
      - 'news/*.html'
      - '.github/workflows/extract-review-visible-text.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check beautifulsoup4
      - name: Extract
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, Comment
          pages=sorted(Path('.').glob('*.html'))+sorted(Path('news').glob('*.html'))
          out=[]
          for p in pages:
              soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
              skip={'script','style','svg','path','noscript','code','pre'}
              i=0
              for node in soup.find_all(string=True):
                  if isinstance(node,Comment) or not node.parent or node.parent.name in skip: continue
                  t=' '.join(str(node).split())
                  if not t: continue
                  i+=1
                  out.append(f'{p.as_posix()}\t{i}\t{node.parent.name}\t{t}')
          Path('review-visible-text.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('nodes',len(out))
          PY
      - name: Commit report
        run: |
          git config user.name 'TNS Site Manager'
          git config user.email 'actions@users.noreply.github.com'
          git add review-visible-text.txt
          git commit -m 'Refresh Korean review visible-text QA report' || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
