name: Apply TNS favicon
on:
  push:
    branches: [feature/tns-favicon-20260908]
    paths: [.github/workflows/one-time-tns-favicon-20260908.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tns-favicon-20260908
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          Path('favicon.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TNS">\n  <polygon points="32,1 63,32 32,63 1,32" fill="#F4D717"/>\n  <text x="32" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">tns</text>\n</svg>\n', encoding='utf-8')
          pat=re.compile(r'<link[^>]+rel=["\'](?:shortcut\s+)?icon["\'][^>]*>\s*',re.I)
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            s=p.read_text(encoding='utf-8'); s2=pat.sub('',s)
            if '</head>' in s2: s2=s2.replace('</head>','<link rel="icon" href="/favicon.svg" type="image/svg+xml">\n</head>',1)
            if s2!=s: p.write_text(s2,encoding='utf-8')
          PY
          git config user.name tnsuhak
          git config user.email tnsuhak@gmail.com
          git add -A
          git rm .github/workflows/one-time-tns-favicon-20260908.yml
          git commit -m 'Use TNS favicon across site'
          git push origin HEAD:feature/tns-favicon-20260908
