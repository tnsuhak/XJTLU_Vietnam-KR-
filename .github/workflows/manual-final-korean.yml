name: Human Final Korean Review
on:
  push:
    branches: [preview/sync-vietnam-site-ko-20260908]
    paths:
      - 'scripts/manual_final_korean.py'
      - 'scripts/manual_final_korean_part2.py'
      - 'scripts/final_global_cleanup.py'
      - 'scripts/final_review_pass3.py'
      - 'scripts/final_review_pass4.py'
      - 'scripts/final_review_pass5.py'
      - 'scripts/final_review_pass6.py'
      - 'scripts/final_review_pass7.py'
      - 'scripts/standardize_subpage_contacts_20260908.py'
      - 'scripts/remove_homepage_cta_band_20260908.py'
      - 'scripts/remove_subpage_source_footers_20260909.py'
      - 'scripts/normalize_menu_links_20260909.py'
      - 'scripts/add_home_market_links_20260909.py'
      - '.github/workflows/manual-final-korean.yml'
permissions:
  contents: write
concurrency:
  group: human-final-ko-${{ github.ref }}
  cancel-in-progress: true
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check beautifulsoup4
      - name: Apply Korean review rules
        run: |
          python scripts/manual_final_korean.py
          python scripts/manual_final_korean_part2.py
          python scripts/final_global_cleanup.py
          python scripts/final_review_pass3.py
          python scripts/final_review_pass4.py
          python scripts/final_review_pass5.py
          python scripts/final_review_pass6.py
          python scripts/final_review_pass7.py
          python scripts/standardize_subpage_contacts_20260908.py
          python scripts/remove_homepage_cta_band_20260908.py
          python scripts/remove_subpage_source_footers_20260909.py
          python scripts/normalize_menu_links_20260909.py
          python scripts/add_home_market_links_20260909.py
      - name: Validate current Korean review
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re
          pages=sorted(Path('.').glob('*.html'))+sorted(Path('news').glob('*.html'))
          assert len(pages)==26, len(pages)
          assert not Path('xjtlu-ranking-2027.html').exists()
          menu_links=(
              '/xjtlu-to-chau-thuong-hai-viet-nam.html',
              '/xjtlu-chi-phi-sinh-hoat-2027.html',
              '/xjtlu-ky-tuc-xa-sip-taicang.html',
          )
          for p in pages:
              raw=p.read_text(encoding='utf-8')
              assert 'xjtlu-ranking-2027.html' not in raw,p
              soup=BeautifulSoup(raw,'html.parser')
              assert soup.html and soup.html.get('lang')=='ko',p
              robots=soup.find('meta',attrs={'name':'robots'})
              assert robots and 'noindex' in robots.get('content',''),p
              assert len(soup.find_all('h1'))==1,p
              menu=soup.find(id='siteMenu')
              assert menu,p
              hrefs={a.get('href') for a in menu.find_all('a',href=True)}
              for href in menu_links:
                  assert href in hrefs,(p,href)
          homepage=Path('index.html').read_text(encoding='utf-8')
          assert 'xjtlu-ranking-2027.html' not in homepage
          start='<!-- VIETNAM-MARKET-HOME-LINKS-20260909 -->'
          end='<!-- /VIETNAM-MARKET-HOME-LINKS-20260909 -->'
          assert homepage.count(start)==1 and homepage.count(end)==1
          home_block=homepage.split(start,1)[1].split(end,1)[0]
          for href in menu_links:
              assert href in home_block,href
          subpages=[p for p in pages if p!=Path('index.html')]
          assert len(subpages)==25,len(subpages)
          for p in subpages:
              raw=p.read_text(encoding='utf-8')
              assert raw.count('TNS_SUBPAGE_CONTACT_START')==1,p
              assert 'tel:+842838233266' in raw and 'tel:+842432321239' in raw,p
              assert 'zalo.me/0336737617' in raw,p
          guide_pages=[p for p in Path('.').glob('*.html') if p.name!='index.html']
          for p in guide_pages:
              raw=p.read_text(encoding='utf-8')
              assert not re.search(r'class=["\'][^"\']*\b(?:sources|source|source-footer)\b',raw,re.I),p
          fee=Path('xjtlu-hoc-phi-hoc-bong-2027.html').read_text(encoding='utf-8')
          admissions=Path('xjtlu-dieu-kien-tuyen-sinh-vietnam-2027.html').read_text(encoding='utf-8')
          living=Path('xjtlu-chi-phi-sinh-hoat-2027.html').read_text(encoding='utf-8')
          dorm=Path('xjtlu-ky-tuc-xa-sip-taicang.html').read_text(encoding='utf-8')
          city=Path('xjtlu-to-chau-thuong-hai-viet-nam.html').read_text(encoding='utf-8')
          assert '99,000 RMB' in fee
          assert 'IELTS 5.0' in admissions and 'TOEFL iBT 62' in admissions
          assert '3,700 RMB' in living and '6,450 RMB' in living and '9,600 RMB' in living
          assert '6,000 RMB' in dorm and '14,000 RMB' in dorm and '5–15분' in dorm
          assert '2,047.5억 RMB' in city and '25–30분' in city
          assert '베트남 학생의 상세 입학조건은' in Path('du-hoc-trung-quoc-2027.html').read_text(encoding='utf-8')
          assert Path('robots.txt').read_text(encoding='utf-8')=='User-agent: *\nDisallow: /\n'
          assert not Path('sitemap.xml').exists()
          print('Korean review validation passed:',len(pages),'pages')
          PY
      - name: Commit final Korean review
        run: |
          git config user.name 'TNS Site Manager'
          git config user.email 'actions@users.noreply.github.com'
          git add -A '*.html' 'news/*.html'
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Normalize Korean homepage guide links'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
